name: Native game
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@v4
      - name: Native system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-game
      - name: Build native game
        run: scripts/native-build.sh
      - name: Survival camera and player UI tests
        run: "cargo test --locked --release -p benilla-app --lib survivors::"
      - name: Original profile validation tests
        run: cargo test --locked -p survivors-reference
      - name: Read-only inspector tests
        run: python3 -m unittest discover -s crates/warcraft-survivors/tools -p 'test_*.py'
